<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nugs Downloader Console</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f2e9;
      --panel: #fffdf8;
      --ink: #1e1c18;
      --muted: #6b655d;
      --line: #d5cfc4;
      --teal: #0f7c82;
      --orange: #cb6930;
      --green: #2d8f43;
      --red: #b9372f;
      --amber: #9a6d10;
      --mono: "IBM Plex Mono", "Courier New", monospace;
      --sans: "Space Grotesk", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 88% 10%, rgba(15, 124, 130, 0.12), transparent 30%),
        radial-gradient(circle at 4% 85%, rgba(203, 105, 48, 0.14), transparent 28%),
        var(--bg);
      min-height: 100vh;
    }

    .shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 28px 18px 40px;
      display: grid;
      gap: 18px;
      animation: fadeUp 440ms ease-out;
    }

    .hero {
      background: linear-gradient(145deg, #1f1c16, #2d2b27 70%);
      color: #f8f5ef;
      border: 1px solid #3d3a34;
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 14px 30px rgba(20, 17, 10, 0.3);
      display: grid;
      grid-template-columns: minmax(250px, 0.6fr) minmax(560px, 1.4fr);
      gap: 14px;
      align-items: center;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #f8f5ef;
      padding: 4px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0 0 3px;
      font-size: clamp(1.2rem, 1.8vw, 1.55rem);
      line-height: 1.15;
    }

    .sub {
      margin: 0;
      color: #ddd7cc;
      max-width: 880px;
      line-height: 1.3;
      font-size: 0.78rem;
    }

    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
      align-items: start;
    }

    .control-layout {
      display: grid;
      grid-template-columns: minmax(340px, 0.68fr) minmax(0, 1.32fr);
      gap: 14px;
      align-items: start;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .form-grid .field,
    .pair .field {
      margin-bottom: 0;
      min-width: 0;
    }

    .download-controls {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .filter-strip {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) repeat(7, 112px);
      gap: 8px;
      align-items: end;
      margin-bottom: 12px;
    }

    .filter-strip label {
      margin-bottom: 4px;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .filter-strip .custom-select-button,
    .filter-strip select {
      min-height: 34px;
      padding: 6px 6px;
      font-size: 0.8rem;
    }

    .filter-strip .custom-select-button {
      gap: 4px;
      overflow: hidden;
    }

    .filter-strip .custom-select-button span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filter-strip .custom-select-button::after {
      width: 6px;
      height: 6px;
    }

    .filter-strip .custom-select-menu {
      min-width: max(100%, 170px);
    }

    .filter-strip .field:first-child .custom-select-button,
    .filter-strip .field:first-child select {
      font-size: 0.9rem;
    }

    .span-all {
      grid-column: 1 / -1;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(43, 36, 26, 0.08);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }

    .hint {
      margin: -3px 0 12px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 0.88rem;
      color: #3d392f;
    }

    .field {
      margin-bottom: 12px;
    }

    input[type="text"],
    input[type="url"],
    input[type="password"],
    select {
      width: 100%;
      border: 1px solid #cfc7bc;
      border-radius: 8px;
      font-family: var(--sans);
      background: #fff;
      color: var(--ink);
      padding: 8px 9px;
      font-size: 0.9rem;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    select {
      appearance: none;
      background:
        linear-gradient(45deg, transparent 50%, #5e574d 50%) calc(100% - 17px) 50% / 6px 6px no-repeat,
        linear-gradient(135deg, #5e574d 50%, transparent 50%) calc(100% - 12px) 50% / 6px 6px no-repeat,
        linear-gradient(to bottom, #fffdf8, #f8f4ec);
      box-shadow: 0 1px 0 rgba(43, 36, 26, 0.04);
      cursor: pointer;
      min-height: 38px;
      padding-right: 34px;
    }

    select:hover {
      border-color: #aaa196;
      background:
        linear-gradient(45deg, transparent 50%, #1f1c16 50%) calc(100% - 17px) 50% / 6px 6px no-repeat,
        linear-gradient(135deg, #1f1c16 50%, transparent 50%) calc(100% - 12px) 50% / 6px 6px no-repeat,
        linear-gradient(to bottom, #fff, #f7f1e7);
    }

    select:disabled {
      color: #8a8277;
      cursor: not-allowed;
      opacity: 1;
      background:
        linear-gradient(45deg, transparent 50%, #aaa196 50%) calc(100% - 17px) 50% / 6px 6px no-repeat,
        linear-gradient(135deg, #aaa196 50%, transparent 50%) calc(100% - 12px) 50% / 6px 6px no-repeat,
        #eee9df;
    }

    .custom-select {
      position: relative;
      width: 100%;
    }

    .enhanced-native-select {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    .custom-select-button {
      width: 100%;
      min-height: 38px;
      border: 1px solid #cfc7bc;
      border-radius: 8px;
      background: linear-gradient(to bottom, #fffdf8, #f8f4ec);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 9px;
      font-family: var(--sans);
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(43, 36, 26, 0.04);
    }

    .custom-select-button::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid #5e574d;
      border-bottom: 2px solid #5e574d;
      transform: rotate(45deg) translateY(-2px);
      flex: 0 0 auto;
    }

    .custom-select.open .custom-select-button {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 124, 130, 0.16);
    }

    .custom-select.disabled .custom-select-button {
      color: #8a8277;
      cursor: not-allowed;
      background: #eee9df;
    }

    .custom-select-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      max-height: 260px;
      overflow: auto;
      padding: 5px;
      border: 1px solid #cfc7bc;
      border-radius: 10px;
      background: #fffdf8;
      box-shadow: 0 16px 34px rgba(43, 36, 26, 0.18);
      display: none;
    }

    .custom-select.open .custom-select-menu {
      display: grid;
      gap: 3px;
    }

    .custom-select-option {
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      padding: 8px 9px;
      font-family: var(--sans);
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
    }

    .custom-select-option:hover,
    .custom-select-option.active {
      background: #e8f3f4;
      color: #0f6468;
    }

    .custom-select-option.selected {
      background: #efe8dc;
      font-weight: 700;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 124, 130, 0.16);
    }

    .pair {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
    }

    .checks {
      border: 1px solid #ded6ca;
      border-radius: 8px;
      padding: 8px 10px;
      background: #faf7f0;
      margin: 10px 0;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .compact-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: start;
      margin-top: 10px;
    }

    .format-group {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .song-panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px;
      min-height: 100%;
      min-width: 0;
    }

    .song-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .song-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .song-title h2 {
      margin: 0;
    }

    .song-title .hint {
      margin: 0;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .song-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .song-list {
      max-height: 380px;
      overflow: auto;
      border: 1px solid #eee6d9;
      border-radius: 8px;
    }

    .queue-table {
      min-width: 760px;
    }

    .queue-table th,
    .queue-table td {
      padding: 7px 9px;
      white-space: nowrap;
      vertical-align: middle;
    }

    .queue-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #efe8dc;
      color: #4d463b;
      font-size: 0.84rem;
    }

    .queue-table .select-col {
      width: 38px;
      text-align: center;
    }

    .queue-table .expand-col {
      width: 42px;
      text-align: center;
    }

    .queue-table tbody tr {
      background: #fffdf8;
      border-top: 1px solid #eee6d9;
    }

    .queue-table tbody tr:hover {
      background: #faf7f0;
    }

    .queue-table label {
      margin: 0;
      color: inherit;
      cursor: pointer;
    }

    .queue-table .media-col {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .media-icon {
      width: 30px;
      height: 30px;
      border: 1px solid #d8cec1;
      border-radius: 7px;
      background: #fffdf8;
      color: #4d463b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .media-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #d8cec1;
      border-radius: 7px;
      background: #fff;
      color: #4d463b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .song-detail-row td {
      background: #faf7f0;
      color: #4d463b;
      white-space: normal;
      padding: 10px 12px;
    }

    .song-detail-list {
      column-count: 3;
      column-gap: 20px;
      margin: 0;
      padding: 0;
      font-size: 0.82rem;
    }

    .setlist-line {
      break-inside: avoid;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .setlist-line strong {
      color: var(--ink);
      white-space: nowrap;
    }

    .downloads-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
      margin-left: auto;
    }

    .downloads-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      flex-wrap: nowrap;
      justify-content: flex-start;
    }

    .downloads-output {
      min-width: 260px;
      max-width: 360px;
      width: 100%;
    }

    .downloads-output input {
      height: 34px;
      padding: 6px 8px;
      font-size: 0.82rem;
    }

    .downloads-controls .downloads-output {
      width: 280px;
      min-width: 220px;
      flex: 0 1 280px;
    }

    .downloads-controls #start-queue-btn {
      width: auto;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .downloads-controls .icon-btn {
      width: 38px;
      height: 38px;
      background: #fffdf8;
    }

    .downloads-controls .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .actions .icon-btn {
      width: 38px;
      height: 38px;
      background: #fffdf8;
      flex: 0 0 auto;
    }

    .actions .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .icon-btn:disabled {
      cursor: default;
      opacity: 0.62;
    }

    .status-icon:disabled {
      opacity: 1;
    }

    .actions .btn-warn.icon-btn {
      color: var(--red);
      border-color: #dfb4ae;
    }

    .actions .btn-muted.icon-btn {
      color: #4d463b;
      border-color: #d8cec1;
    }

    .downloads-controls .btn-warn.icon-btn {
      color: var(--red);
      border-color: #dfb4ae;
    }

    .downloads-controls .btn-muted.icon-btn {
      color: #4d463b;
      border-color: #d8cec1;
    }

    .queue-title,
    .queue-venue {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: var(--line);
      flex: 1;
    }

    .inline-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .inline-actions .btn {
      width: auto;
      white-space: nowrap;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: #2f2a21;
      font-size: 0.86rem;
    }

    .check input {
      accent-color: var(--teal);
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 11px;
      font-family: var(--sans);
      font-weight: 600;
      cursor: pointer;
      transition: transform 80ms ease, opacity 120ms ease, background 120ms ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal), #0c5f64);
      color: #fff;
      width: 100%;
    }

    .btn-muted {
      background: #efe8dc;
      border-color: #d8cfc2;
      color: #2d2a23;
    }

    .btn-warn {
      background: #f8dcd3;
      border-color: #e4b9a8;
      color: #7a2b17;
    }

    .msg {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
      display: none;
    }

    .msg.show {
      display: block;
    }

    .msg.info {
      background: #e8f3f4;
      border: 1px solid #c6e1e3;
      color: #164a4f;
    }

    .msg.warn {
      background: #faecd9;
      border: 1px solid #efd2a8;
      color: #704a09;
    }

    .msg.error {
      background: #f9dfdc;
      border: 1px solid #ebb7b2;
      color: #762922;
    }

    .downloads-panel {
      padding: 0;
      overflow: hidden;
    }

    .downloads-panel summary {
      list-style: none;
      cursor: pointer;
    }

    .downloads-panel summary::-webkit-details-marker {
      display: none;
    }

    .downloads-body {
      padding: 0 12px 12px;
    }

    .jobs-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
    }

    .jobs-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .jobs-title-row h2 {
      margin: 0;
      font-size: 0.94rem;
      white-space: nowrap;
    }

    .downloads-status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: min(360px, 44vw);
    }

    .download-status-bar {
      display: flex;
      flex: 1;
      height: 8px;
      min-width: 140px;
      overflow: hidden;
      border-radius: 999px;
      background: #ebe4db;
      border: 1px solid #d8cec1;
    }

    .download-status-segment {
      height: 100%;
      min-width: 0;
    }

    .download-status-segment.running { background: #0f7c82; }
    .download-status-segment.pending { background: #d99a28; }
    .download-status-segment.success { background: #2d8f43; }
    .download-status-segment.failed { background: #b9372f; }
    .download-status-segment.cancelled { background: #8b8174; }

    .job-progress {
      display: grid;
      gap: 4px;
      min-width: 140px;
    }

    .job-progress-bar {
      height: 10px;
      overflow: hidden;
      border: 1px solid #d8cec1;
      border-radius: 999px;
      background: #ebe4db;
    }

    .job-progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: #0f7c82;
    }

    .job-progress.pending .job-progress-fill { background: #d99a28; }
    .job-progress.success .job-progress-fill { background: #2d8f43; }
    .job-progress.failed .job-progress-fill { background: #b9372f; }
    .job-progress.cancelled .job-progress-fill { background: #8b8174; }

    .job-progress-label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.74rem;
      line-height: 1;
      white-space: nowrap;
    }

    .accordion-caret {
      display: inline-block;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.78rem;
      transition: transform 120ms ease;
    }

    .downloads-panel[open] .accordion-caret {
      transform: rotate(90deg);
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      margin-left: auto;
    }

    .page-size {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .page-size select {
      width: auto;
      padding: 5px 8px;
      font-size: 0.82rem;
    }

    .page-size .custom-select {
      width: 82px;
      flex: 0 0 auto;
    }

    .page-size .custom-select-button {
      min-height: 34px;
      padding: 6px 8px;
      font-size: 0.82rem;
    }

    .meta {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.78rem;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 10px 10px;
      text-align: left;
      border-bottom: 1px solid #ece7de;
      vertical-align: top;
      font-size: 0.9rem;
    }

    th {
      background: #f8f4ec;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #5f574d;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .mono {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: #3f382f;
      word-break: break-all;
    }

    .show-detail {
      display: grid;
      gap: 4px;
      min-width: 220px;
    }

    .show-title {
      font-weight: 700;
      color: var(--ink);
    }

    .show-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 7px;
      background: #efe8dc;
      color: #423b31;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.77rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .status-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      padding: 0;
      cursor: default;
    }

    .status-icon[data-action] {
      cursor: pointer;
    }

    .status-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .pending { background: #fdf2dc; color: var(--amber); border-color: #f2d4a1; }
    .running { background: #ddf3f4; color: #0f6468; border-color: #b6dee0; }
    .success { background: #deeedf; color: #246d33; border-color: #b9d9bc; }
    .failed { background: #f6ddda; color: var(--red); border-color: #e8b6b0; }
    .cancelled { background: #ebe4db; color: #665f56; border-color: #d8cec1; }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .jobs-empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .credentials-bar {
      display: grid;
      grid-template-columns: minmax(260px, 1.35fr) minmax(170px, 0.8fr) 112px 92px;
      gap: 8px;
      align-items: end;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      width: 100%;
      justify-self: end;
    }

    .credentials-grid {
      display: contents;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .hero .credentials-bar .field {
      margin-bottom: 0;
    }

    .hero .credentials-bar input {
      padding: 6px 8px;
      font-size: 0.82rem;
      height: 34px;
    }

    .hero .credentials-bar .btn {
      width: 100%;
      height: 34px;
      justify-content: center;
      padding: 6px 10px;
      white-space: nowrap;
      align-self: end;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 930px) {
      .hero,
      .control-layout,
      .credentials-bar,
      .credentials-grid,
      .filter-strip,
      .form-grid,
      .grid {
        grid-template-columns: 1fr;
      }
      .pair {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">

        <div>

          <div class="song-panel">

  <script>
    const pollMs = 4000;
    const form = document.getElementById("job-form");
    const credentialsForm = document.getElementById("credentials-form");
    const credentialsStatus = document.getElementById("credentials-status");
    const credentialsBtn = document.getElementById("credentials-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const formMessage = document.getElementById("form-message");
    const submitBtn = document.getElementById("submit-btn");
    const refreshBtn = document.getElementById("refresh-btn");
    const startQueueBtn = document.getElementById("start-queue-btn");
    const cancelQueueBtn = document.getElementById("cancel-queue-btn");
    const deleteQueueBtn = document.getElementById("delete-queue-btn");
    const jobsBody = document.getElementById("jobs-body");
    const outPathInput = document.getElementById("out_path");
    const downloadsPanel = document.getElementById("downloads-panel");
    const downloadsSummary = document.getElementById("downloads-summary");
    const downloadStatusBar = document.getElementById("download-status-bar");
    const downloadsOutput = document.querySelector(".downloads-output");
    const jobsPageSize = document.getElementById("jobs-page-size");
    const jobsPrevPage = document.getElementById("jobs-prev-page");
    const jobsNextPage = document.getElementById("jobs-next-page");
    const jobsPageStatus = document.getElementById("jobs-page-status");
    const lastUpdated = document.getElementById("last-updated");
    const artistSelect = document.getElementById("artist_select");
    const yearFilter = document.getElementById("year_filter");
    const mediaFilter = document.getElementById("media_filter");
    const downloadMode = document.getElementById("download_mode");
    const releaseCheckList = document.getElementById("release-check-list");
    const selectionHint = document.getElementById("selection-hint");
    const selectionPageSize = document.getElementById("selection-page-size");
    const selectionPrevPage = document.getElementById("selection-prev-page");
    const selectionNextPage = document.getElementById("selection-next-page");
    const selectionPageStatus = document.getElementById("selection-page-status");
    let currentReleases = [];
    let currentFilteredReleases = [];
    let selectedReleaseUrls = new Set();
    let selectionPage = 1;
    let queuePaused = false;
    let userSelectedDownloadMode = downloadMode.value || "both";
    let allJobs = [];
    let jobsPage = 1;
    const expandedReleaseIds = new Set();
    const releaseDetailCache = new Map();
    let customSelectTypeahead = "";
    let customSelectTypeaheadTimer = null;
    const alphaSorter = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });

    function closeCustomSelects(except = null) {
      document.querySelectorAll(".custom-select.open").forEach((selectShell) => {
        if (selectShell !== except) selectShell.classList.remove("open");
      });
    }

    function syncCustomSelect(select) {
      const shell = select.closest(".custom-select");
      if (!shell) return;
      const button = shell.querySelector(".custom-select-button");
      const menu = shell.querySelector(".custom-select-menu");
      const selectedOption = select.selectedOptions[0] || select.options[0];
      button.innerHTML = `<span>${escapeHtml(selectedOption ? selectedOption.textContent : "")}</span>`;
      button.disabled = select.disabled;
      shell.classList.toggle("disabled", select.disabled);
      menu.innerHTML = Array.from(select.options).map((option) => `
        <button class="custom-select-option ${option.selected ? "selected active" : ""}" type="button" data-value="${escapeHtml(option.value)}">
          ${escapeHtml(option.textContent || "")}
        </button>
      `).join("");
    }

    function syncCustomSelects() {
      document.querySelectorAll("select.enhanced-native-select").forEach(syncCustomSelect);
    }

    function activateCustomOption(shell, optionButton) {
      shell.querySelectorAll(".custom-select-option.active").forEach((option) => option.classList.remove("active"));
      optionButton.classList.add("active");
      optionButton.scrollIntoView({ block: "nearest" });
    }

    function chooseCustomOption(select, shell, optionButton) {
      select.value = optionButton.getAttribute("data-value") || "";
      select.dispatchEvent(new Event("change", { bubbles: true }));
      syncCustomSelect(select);
      shell.classList.remove("open");
    }

    function typeaheadCustomSelect(select, shell, key) {
      const character = key.length === 1 ? key.toLowerCase() : "";
      if (!character || select.disabled) return false;
      clearTimeout(customSelectTypeaheadTimer);
      customSelectTypeahead += character;
      customSelectTypeaheadTimer = setTimeout(() => {
        customSelectTypeahead = "";
      }, 800);
      if (!shell.classList.contains("open")) {
        closeCustomSelects(shell);
        shell.classList.add("open");
      }
      const options = Array.from(shell.querySelectorAll(".custom-select-option"));
      const match = options.find((option) => option.textContent.trim().toLowerCase().startsWith(customSelectTypeahead))
        || options.find((option) => option.textContent.trim().toLowerCase().startsWith(character));
      if (match) activateCustomOption(shell, match);
      return true;
    }

    function enhanceSelect(select) {
      if (select.dataset.enhanced === "true") return;
      const shell = document.createElement("div");
      shell.className = "custom-select";
      const button = document.createElement("button");
      button.className = "custom-select-button";
      button.type = "button";
      const menu = document.createElement("div");
      menu.className = "custom-select-menu";

      select.parentNode.insertBefore(shell, select);
      shell.appendChild(select);
      shell.appendChild(button);
      shell.appendChild(menu);
      select.dataset.enhanced = "true";
      select.classList.add("enhanced-native-select");

      button.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (select.disabled) return;
        const willOpen = !shell.classList.contains("open");
        closeCustomSelects(shell);
        shell.classList.toggle("open", willOpen);
      });

      button.addEventListener("keydown", (event) => {
        const activeOption = shell.querySelector(".custom-select-option.active");
        if (["Enter", " "].includes(event.key) && shell.classList.contains("open") && activeOption) {
          event.preventDefault();
          chooseCustomOption(select, shell, activeOption);
        } else if (["Enter", " ", "ArrowDown"].includes(event.key)) {
          event.preventDefault();
          if (!select.disabled) {
            closeCustomSelects(shell);
            shell.classList.add("open");
            const selectedOption = shell.querySelector(".custom-select-option.selected") || shell.querySelector(".custom-select-option");
            if (selectedOption) activateCustomOption(shell, selectedOption);
          }
        } else if (event.key === "Escape") {
          shell.classList.remove("open");
        } else if (typeaheadCustomSelect(select, shell, event.key)) {
          event.preventDefault();
        }
      });

      menu.addEventListener("click", (event) => {
        const optionButton = event.target.closest(".custom-select-option");
        if (!optionButton) return;
        chooseCustomOption(select, shell, optionButton);
      });

      select.addEventListener("change", () => syncCustomSelect(select));
      syncCustomSelect(select);
    }

    function enhanceSelects() {
      document.querySelectorAll("select").forEach(enhanceSelect);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function fmtDate(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleString();
    }

    function fmtBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return "-";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let value = bytes;
      let idx = 0;
      while (value >= 1024 && idx < units.length - 1) {
        value /= 1024;
        idx += 1;
      }
      return `${value.toFixed(value >= 10 || idx === 0 ? 0 : 1)} ${units[idx]}`;
    }

    function statusClass(status) {
      return ["pending", "running", "success", "failed", "cancelled"].includes(status) ? status : "pending";
    }

    function renderStatus(status) {
      const safeStatus = statusClass(status);
      if (safeStatus === "pending") {
        return `<button class="status status-icon pending" type="button" data-action="queue-resume" aria-label="Start downloads" title="Start downloads"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg></button>`;
      }
      if (safeStatus === "running") {
        return `<button class="status status-icon running" type="button" data-action="queue-pause" aria-label="Pause downloads" title="Pause downloads"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></button>`;
      }
      if (safeStatus === "cancelled") {
        return `<button class="status status-icon cancelled" type="button" aria-label="Cancelled" title="Cancelled" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>`;
      }
      return "";
    }

    function syncQueueToggleButton() {
      const label = queuePaused ? "Start all" : "Pause all";
      const icon = queuePaused
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';
      startQueueBtn.setAttribute("aria-label", label);
      startQueueBtn.setAttribute("title", label);
      startQueueBtn.innerHTML = icon;
    }

    function setMessage(kind, text) {
      formMessage.className = `msg show ${kind}`;
      formMessage.innerHTML = escapeHtml(text);
    }

    function clearMessage() {
      formMessage.className = "msg";
      formMessage.textContent = "";
    }

    function selectedModeFlags() {
      const mode = downloadMode.value;
      return {
        download_audio: mode === "both" || mode === "audio",
        download_video: mode === "both" || mode === "video",
      };
    }

    function selectedRelease() {
      if (selectedReleaseUrls.size !== 1) return null;
      const url = [...selectedReleaseUrls][0];
      return currentReleases.find((release) => release.url === url) || null;
    }

    function modeAvailability() {
      const release = selectedRelease();
      const selected = selectedReleaseUrls.size
        ? currentFilteredReleases.filter((item) => selectedReleaseUrls.has(item.url))
        : [];
      const releases = release ? [release] : (selected.length ? selected : currentFilteredReleases);
      const hasAudio = releases.length ? releases.some((item) => item.has_audio) : true;
      const hasVideo = releases.length ? releases.some((item) => item.has_video) : true;

      if (mediaFilter.value === "audio_only") {
        return { audio: true, video: false };
      }
      if (mediaFilter.value === "audio") {
        return { audio: hasAudio, video: hasVideo };
      }
      if (mediaFilter.value === "video") {
        return { audio: hasAudio, video: true };
      }
      return { audio: hasAudio, video: hasVideo };
    }

    function syncModeOptions() {
      const availability = modeAvailability();
      const options = [];
      if (availability.audio && availability.video) {
        options.push(["both", "Audio + video"]);
      }
      if (availability.audio) {
        options.push(["audio", "Audio only"]);
      }
      if (availability.video) {
        options.push(["video", "Video only"]);
      }

      downloadMode.innerHTML = options.map(([value, label]) => (
        `<option value="${value}">${label}</option>`
      )).join("");
      downloadMode.value = options.some(([value]) => value === userSelectedDownloadMode)
        ? userSelectedDownloadMode
        : options[0]?.[0] || "both";
      syncCustomSelect(downloadMode);
    }

    function detailFromErrorPayload(payload, status) {
      if (!payload) return `Request failed (${status})`;
      const detail = payload.detail;
      if (!detail) return `Request failed (${status})`;
      if (typeof detail === "string") return detail;
      if (typeof detail === "object" && detail.message) {
        if (Array.isArray(detail.already_downloaded_urls) && detail.already_downloaded_urls.length) {
          return `${detail.message}: ${detail.already_downloaded_urls.join(", ")}`;
        }
        return detail.message;
      }
      return JSON.stringify(detail);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      let payload = null;
      try {
        payload = await response.json();
      } catch (_) {
        payload = null;
      }

      if (!response.ok) {
        throw new Error(detailFromErrorPayload(payload, response.status));
      }
      return payload;
    }

    function renderCredentialsStatus(status) {
      const hasLogin = Boolean(status.email || status.has_password);
      credentialsStatus.textContent = hasLogin ? "Login saved" : "Login required";
      credentialsBtn.textContent = status.has_saved_credentials ? "Update Login" : "Login";
    }

    async function loadCredentialsStatus() {
      try {
        renderCredentialsStatus(await api("/credentials"));
      } catch (err) {
        credentialsStatus.textContent = err.message || "Could not load credential status.";
      }
    }

    async function saveCredentials(event) {
      event.preventDefault();
      credentialsBtn.disabled = true;
      credentialsBtn.textContent = "Saving...";
      const payload = {
        email: document.getElementById("nugs_email").value.trim(),
        password: document.getElementById("nugs_password").value,
      };
      try {
        renderCredentialsStatus(await api("/credentials", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }));
        document.getElementById("nugs_password").value = "";
        await Promise.all([
          loadArtists(artistSelect.value),
          loadYearsForAvailability(yearFilter.value),
        ]);
      } catch (err) {
        credentialsStatus.textContent = err.message || "Could not save credentials.";
      } finally {
        credentialsBtn.disabled = false;
      }
    }

    function resetCatalogUi() {
      artistSelect.value = "";
      artistSelect.innerHTML = '<option value="">Choose a band...</option>';
      yearFilter.value = "";
      yearFilter.innerHTML = '<option value="">All years</option>';
      yearFilter.disabled = true;
      currentReleases = [];
      currentFilteredReleases = [];
      selectedReleaseUrls = new Set();
      releaseCheckList.innerHTML = '<div class="meta">Login required.</div>';
      selectionHint.textContent = "Login to load available downloads.";
      renderSelectionPagination(1);
      syncCustomSelect(artistSelect);
      syncCustomSelect(yearFilter);
    }

    async function logoutCredentials() {
      logoutBtn.disabled = true;
      credentialsBtn.disabled = true;
      try {
        renderCredentialsStatus(await api("/credentials", { method: "DELETE" }));
        document.getElementById("nugs_email").value = "";
        document.getElementById("nugs_password").value = "";
        resetCatalogUi();
      } catch (err) {
        credentialsStatus.textContent = err.message || "Could not log out.";
      } finally {
        logoutBtn.disabled = false;
        credentialsBtn.disabled = false;
      }
    }

    function buildPayload() {
      const audioFormat = document.getElementById("format").value;
      const videoFormat = document.getElementById("video_format").value;
      const audioOutputFormat = document.getElementById("audio_output_format").value;
      const videoOutputFormat = document.getElementById("video_output_format").value;
      const outPath = outPathInput.value.trim();
      const modeFlags = selectedModeFlags();

      const payload = {
        download_audio: modeFlags.download_audio,
        download_video: modeFlags.download_video,
        download_if_already_downloaded: true,
      };

      if (audioFormat) payload.format = Number(audioFormat);
      if (videoFormat) payload.video_format = Number(videoFormat);
      if (audioOutputFormat) payload.audio_output_format = audioOutputFormat;
      if (videoOutputFormat) payload.video_output_format = videoOutputFormat;
      if (outPath) payload.out_path = outPath;
      return payload;
    }

    async function chooseOutputPath(event) {
      event.preventDefault();
      event.stopPropagation();
      try {
        const current = outPathInput.value.trim();
        const query = current ? `?current=${encodeURIComponent(current)}` : "";
        const result = await api(`/folders/choose${query}`, { method: "POST" });
        if (result.status === "selected" && result.path) {
          outPathInput.value = result.path;
        }
      } catch (err) {
        alert(err.message || "Could not choose an output folder.");
      }
    }

    function releaseLabel(release) {
      return `${release.date || release.year || ""} ${release.artist_name || ""} - ${release.title || release.id}`;
    }

    function matchesMediaFilter(release, filter) {
      if (filter === "audio") return Boolean(release.has_audio);
      if (filter === "audio_only") return Boolean(release.has_audio) && !release.has_video;
      if (filter === "video") return Boolean(release.has_video);
      return true;
    }

    function filteredReleases(year = yearFilter.value, media = mediaFilter.value) {
      return currentReleases.filter((release) => {
        const yearMatches = !year || release.year === year;
        return yearMatches && matchesMediaFilter(release, media);
      }).sort((a, b) => (
        alphaSorter.compare(a.artist_name || "", b.artist_name || "")
        || alphaSorter.compare(a.title || "", b.title || "")
        || alphaSorter.compare(a.venue || "", b.venue || "")
        || alphaSorter.compare(a.date || a.year || "", b.date || b.year || "")
      ));
    }

    function renderReleases(year = "", media = "") {
      const releases = filteredReleases(year, media);
      currentFilteredReleases = releases;
      selectedReleaseUrls = new Set([...selectedReleaseUrls].filter((url) => releases.some((release) => release.url === url)));
      if (!selectedReleaseUrls.size && releases.length === 1) selectedReleaseUrls.add(releases[0].url);
      selectionPage = 1;
      renderQueueSelection();
      syncModeOptions();
    }

    function selectionPageItems() {
      const pageSize = Number(selectionPageSize.value) || 10;
      const totalPages = Math.max(1, Math.ceil(currentFilteredReleases.length / pageSize));
      selectionPage = Math.min(Math.max(1, selectionPage), totalPages);
      const start = (selectionPage - 1) * pageSize;
      return {
        releases: currentFilteredReleases.slice(start, start + pageSize),
        totalPages,
      };
    }

    function selectionState() {
      const urls = currentFilteredReleases.map((release) => release.url);
      const selectedCount = urls.filter((url) => selectedReleaseUrls.has(url)).length;
      return {
        selectedCount,
        allSelected: urls.length > 0 && selectedCount === urls.length,
        partiallySelected: selectedCount > 0 && selectedCount < urls.length,
      };
    }

    function renderSongDetails(release) {
      const detail = releaseDetailCache.get(String(release.id));
      if (!detail) return '<div class="meta">Loading songs...</div>';
      const songs = Array.isArray(detail.songs) ? detail.songs : [];
      if (!songs.length) return '<div class="meta">No song list available.</div>';
      const sets = [];
      songs.forEach((song) => {
        const setValue = song.set || song.disc || "";
        const label = setValue ? `Set ${setValue}` : "Setlist";
        let group = sets.find((item) => item.label === label);
        if (!group) {
          group = { label, songs: [] };
          sets.push(group);
        }
        group.songs.push(song.title || "Untitled");
      });
      return `
        <div class="song-detail-list">
          ${sets.map((set) => `
            <div class="setlist-line"><strong>${escapeHtml(set.label)}:</strong> ${escapeHtml(set.songs.join(", "))}</div>
          `).join("")}
        </div>
      `;
    }

    function renderMediaIcons(release) {
      const icons = [];
      if (release.has_audio) {
        icons.push('<span class="media-icon" aria-label="Audio available" title="Audio available"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>');
      }
      if (release.has_video) {
        icons.push('<span class="media-icon" aria-label="Video available" title="Video available"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="14" height="12" rx="2"></rect><path d="m17 10 4-3v10l-4-3"></path></svg></span>');
      }
      return icons.join("") || '<span class="meta">-</span>';
    }

    function renderQueueSelection() {
      const { selectedCount, allSelected, partiallySelected } = selectionState();
      selectionHint.textContent = currentFilteredReleases.length
        ? `${selectedCount} of ${currentFilteredReleases.length} downloads selected.`
        : "No downloads match the current filters.";

      if (!currentFilteredReleases.length) {
        releaseCheckList.innerHTML = '<div class="meta">No available downloads.</div>';
        selectionPageStatus.textContent = "Page 1 of 1";
        selectionPrevPage.disabled = true;
        selectionNextPage.disabled = true;
        return;
      }

      const { releases, totalPages } = selectionPageItems();
      const rows = releases.map((release) => {
        const rowId = `release-${String(release.id || release.url).replace(/[^a-zA-Z0-9_-]/g, "-")}`;
        const expanded = expandedReleaseIds.has(String(release.id));
        return `
          <tr>
            <td class="expand-col"><button class="icon-btn" type="button" data-action="toggle-release" data-release-id="${escapeHtml(release.id)}" aria-label="${expanded ? "Collapse setlist" : "Expand setlist"}" title="${expanded ? "Collapse setlist" : "Expand setlist"}"><svg viewBox="0 0 24 24" aria-hidden="true">${expanded ? '<path d="m18 15-6-6-6 6"></path>' : '<path d="m6 9 6 6 6-6"></path>'}</svg></button></td>
            <td class="select-col"><input id="${escapeHtml(rowId)}" type="checkbox" data-release-url="${escapeHtml(release.url)}" ${selectedReleaseUrls.has(release.url) ? "checked" : ""} /></td>
            <td>${escapeHtml(release.date || release.year || "-")}</td>
            <td>${escapeHtml(release.artist_name || "-")}</td>
            <td class="queue-title"><label for="${escapeHtml(rowId)}">${escapeHtml(release.title || release.id)}</label></td>
            <td class="queue-venue">${escapeHtml(release.venue || "-")}</td>
            <td class="media-col">${renderMediaIcons(release)}</td>
          </tr>
          ${expanded ? `<tr class="song-detail-row"><td colspan="7">${renderSongDetails(release)}</td></tr>` : ""}
        `;
      }).join("");
      releaseCheckList.innerHTML = `
        <table class="queue-table">
          <thead>
            <tr>
              <th class="expand-col"></th>
              <th class="select-col"><input id="selection-toggle" type="checkbox" data-select-all="true" ${allSelected ? "checked" : ""} /></th>
              <th>Date</th>
              <th>Band</th>
              <th>Show</th>
              <th>Venue</th>
              <th>Media</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      const toggle = document.getElementById("selection-toggle");
      if (toggle) toggle.indeterminate = partiallySelected;
      selectionPageStatus.textContent = `Page ${selectionPage} of ${totalPages}`;
      selectionPrevPage.disabled = selectionPage <= 1;
      selectionNextPage.disabled = selectionPage >= totalPages;
    }

    function renderYears(releases) {
      const years = [...new Set(releases.map((release) => release.year).filter(Boolean))].sort().reverse();
      yearFilter.disabled = years.length === 0;
      yearFilter.innerHTML = '<option value="">All years</option>' + years.map((year) => (
        `<option value="${escapeHtml(year)}">${escapeHtml(year)}</option>`
      )).join("");
      syncCustomSelect(yearFilter);
    }

    async function loadYearsForAvailability(preferredYear = yearFilter.value) {
      const media = mediaFilter.value;
      yearFilter.disabled = true;
      yearFilter.innerHTML = '<option value="">Loading years...</option>';
      syncCustomSelect(yearFilter);
      try {
        const query = media ? `?media=${encodeURIComponent(media)}` : "";
        const payload = await api(`/catalog/years${query}`);
        const years = payload.items || [];
        yearFilter.innerHTML = '<option value="">All years</option>' + years.map((year) => (
          `<option value="${escapeHtml(year)}">${escapeHtml(year)}</option>`
        )).join("");
        yearFilter.disabled = years.length === 0;
        if (preferredYear && years.some((year) => String(year) === String(preferredYear))) {
          yearFilter.value = preferredYear;
        }
      } catch (err) {
        yearFilter.innerHTML = '<option value="">Could not load years</option>';
        yearFilter.disabled = false;
        setMessage("error", err.message || "Could not load years.");
      }
      syncCustomSelect(yearFilter);
    }

    async function loadArtists(preferredArtistId = "") {
      try {
        const media = mediaFilter.value;
        artistSelect.disabled = true;
        artistSelect.innerHTML = '<option value="">Loading bands...</option>';
        syncCustomSelect(artistSelect);
        const query = media ? `?media=${encodeURIComponent(media)}` : "";
        const payload = await api(`/catalog/artists${query}`);
        const artists = (payload.items || []).slice().sort((a, b) => alphaSorter.compare(a.name || "", b.name || ""));
        artistSelect.innerHTML = '<option value="">Choose a band...</option>' + artists.map((artist) => (
          `<option value="${escapeHtml(artist.id)}">${escapeHtml(artist.name)}</option>`
        )).join("");
        artistSelect.disabled = false;
        if (preferredArtistId && artists.some((artist) => String(artist.id) === String(preferredArtistId))) {
          artistSelect.value = preferredArtistId;
        }
        syncCustomSelect(artistSelect);
      } catch (err) {
        artistSelect.innerHTML = '<option value="">Could not load bands</option>';
        artistSelect.disabled = false;
        syncCustomSelect(artistSelect);
        setMessage("error", err.message || "Could not load bands.");
      }
    }

    async function loadReleasesForSelectedArtist() {
      const artistId = artistSelect.value;
      currentReleases = [];
      currentFilteredReleases = [];
      yearFilter.disabled = true;
      yearFilter.innerHTML = '<option value="">All years</option>';
      syncCustomSelect(yearFilter);
      selectedReleaseUrls.clear();
      releaseCheckList.innerHTML = '<div class="meta">Loading downloads...</div>';
      selectionHint.textContent = "Loading...";
      if (!artistId) {
        renderQueueSelection();
        return;
      }

      try {
        const payload = await api(`/catalog/artists/${encodeURIComponent(artistId)}/releases`);
        currentReleases = payload.items || [];
        renderYears(currentReleases);
        renderReleases(yearFilter.value, mediaFilter.value);
      } catch (err) {
        releaseCheckList.innerHTML = '<div class="meta">Could not load downloads.</div>';
        setMessage("error", err.message || "Could not load releases.");
      }
    }

    function resetDownloadForm() {
      form.reset();
      currentReleases = [];
      currentFilteredReleases = [];
      selectedReleaseUrls.clear();
      yearFilter.disabled = true;
      yearFilter.innerHTML = '<option value="">All years</option>';
      syncCustomSelect(yearFilter);
      renderQueueSelection();
      syncModeOptions();
      if ([...downloadMode.options].some((option) => option.value === "both")) {
        downloadMode.value = "both";
      }
      submitBtn.textContent = "Queue Downloads";
    }

    async function createJobForUrl(url, basePayload) {
      const payload = { ...basePayload, urls: [url] };
      await api("/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    }

    async function queueSelectedDownloads() {
      const base = buildPayload();
      const selectedUrls = currentFilteredReleases
        .filter((release) => selectedReleaseUrls.has(release.url))
        .map((release) => release.url);
      if (!selectedUrls.length) throw new Error("Select at least one available download to queue.");
      await api("/queue/pause", { method: "POST" });
      queuePaused = true;
      syncQueueToggleButton();
      for (const url of selectedUrls) {
        await createJobForUrl(url, base);
      }
    }

    async function submitJob(event) {
      event.preventDefault();
      clearMessage();

      const basePayload = buildPayload();
      if (!basePayload.download_audio && !basePayload.download_video) {
        setMessage("error", "Choose audio, video, or both in Mode.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Queueing...";

      try {
        await queueSelectedDownloads();
        await refreshJobs();
      } catch (err) {
        setMessage("error", err.message || "Failed to create job");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Queue Downloads";
      }
    }

    async function toggleReleaseDetails(releaseId) {
      if (!releaseId) return;
      const key = String(releaseId);
      if (expandedReleaseIds.has(key)) {
        expandedReleaseIds.delete(key);
        renderQueueSelection();
        return;
      }
      expandedReleaseIds.add(key);
      renderQueueSelection();
      if (!releaseDetailCache.has(key)) {
        try {
          releaseDetailCache.set(key, await api(`/catalog/releases/${encodeURIComponent(key)}`));
        } catch (err) {
          releaseDetailCache.set(key, { songs: [], error: err.message || "Could not load songs." });
        }
        renderQueueSelection();
      }
    }

    async function cancelJob(jobId) {
      try {
        await api(`/jobs/${encodeURIComponent(jobId)}/cancel`, { method: "POST" });
        await refreshJobs();
      } catch (err) {
        alert(err.message || "Failed to cancel job");

    }

    async function deleteJob(jobId) {
      try {
        await api(`/jobs/${encodeURIComponent(jobId)}`, { method: "DELETE" });

    async function restartJob(jobId) {

        await api(`/jobs/${encodeURIComponent(jobId)}/restart`, { method: "POST" });
        await refreshJobs();

        alert(err.message || "Failed to restart job");

    async function toggleQueuePause() {

        const endpoint = queuePaused ? "/queue/resume" : "/queue/pause";

        queuePaused = Boolean(cfg.queue_paused);
        syncQueueToggleButton();
        await refreshJobs();

    async function cancelQueue() {

      if (!confirmed) return;

      cancelQueueBtn.disabled = true;
      cancelQueueBtn.setAttribute("aria-label", "Cancelling downloads");

        await refreshJobs();
      } catch (err) {
        alert(err.message || "Failed to cancel downloads");
      } finally {
        cancelQueueBtn.disabled = false;
        cancelQueueBtn.setAttribute("aria-label", "Cancel all");
        cancelQueueBtn.setAttribute("title", "Cancel all");

      const confirmed = window.confirm("Delete all non-running downloads from the current downloads list?");
      if (!confirmed) return;

      deleteQueueBtn.disabled = true;
      deleteQueueBtn.setAttribute("aria-label", "Deleting downloads");
      deleteQueueBtn.setAttribute("title", "Deleting downloads");

        await api("/queue/delete", { method: "POST" });
        jobsPage = 1;
        await refreshJobs();
      } catch (err) {
        alert(err.message || "Failed to delete downloads");
      } finally {
        deleteQueueBtn.disabled = false;
        deleteQueueBtn.setAttribute("aria-label", "Delete all");
        deleteQueueBtn.setAttribute("title", "Delete all");

    function jobStatusCounts(jobs) {
      return jobs.reduce((counts, job) => {
        counts[job.status] = (counts[job.status] || 0) + 1;
        return counts;
      }, {});
    }

    function updateDownloadsSummary(jobs) {
      const counts = jobStatusCounts(jobs);
      const parts = [`${jobs.length} total`];
      ["running", "pending", "success", "failed", "cancelled"].forEach((status) => {
        if (counts[status]) parts.push(`${counts[status]} ${status}`);
      });
      downloadsSummary.textContent = parts.join(" • ");
      const total = jobs.length || 1;
      downloadStatusBar.innerHTML = ["running", "pending", "success", "failed", "cancelled"].map((status) => {
        const count = counts[status] || 0;
        if (!count) return "";
        return `<span class="download-status-segment ${status}" style="width: ${(count / total) * 100}%"></span>`;
      }).join("");
    }

    function currentJobsPage() {
      const pageSize = Number(jobsPageSize.value) || 10;
      const totalPages = Math.max(1, Math.ceil(allJobs.length / pageSize));
      jobsPage = Math.min(Math.max(1, jobsPage), totalPages);
      const start = (jobsPage - 1) * pageSize;
      return {
        pageJobs: allJobs.slice(start, start + pageSize),
        pageSize,
        totalPages,
      };
    }

    function renderPagination(totalPages) {
      jobsPageStatus.textContent = `Page ${jobsPage} of ${totalPages}`;
      jobsPrevPage.disabled = jobsPage <= 1;
      jobsNextPage.disabled = jobsPage >= totalPages;
    }

    function renderShowDetail(job, detail) {
      const summary = (detail && detail.summary) || job.summary || {};
      const titleParts = [];
      if (summary.artist_name) titleParts.push(summary.artist_name);
      if (summary.title) titleParts.push(summary.title);
      const title = titleParts.length ? titleParts.join(" - ") : (summary.urls && summary.urls[0]) || "Download";
      const metaParts = [];
      if (summary.date) metaParts.push(summary.date);
      if (summary.venue) metaParts.push(summary.venue);
      if (summary.release_id) metaParts.push(`release ${summary.release_id}`);
      const modeText = String(summary.mode || "").toLowerCase();
      const showAudioDetails = !modeText || modeText.includes("audio");
      const showVideoDetails = !modeText || modeText.includes("video");
      const tags = [
        summary.mode,
        showAudioDetails && summary.audio_quality && `Audio: ${summary.audio_quality}`,
        showVideoDetails && summary.video_quality && `Video: ${summary.video_quality}`,
        showAudioDetails && summary.audio_output_format && `Audio out: ${summary.audio_output_format}`,
        showVideoDetails && summary.video_output_format && `Video out: ${summary.video_output_format}`,
        summary.track_count ? `${summary.track_count} songs` : "",
      ].filter(Boolean);

      return `
        <div class="show-detail">
          <div class="show-title">${escapeHtml(title)}</div>
          <div class="meta">${escapeHtml(metaParts.join(" • ") || "-")}</div>
          <div class="show-tags">${tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        </div>
      `;
    }

    function renderJobProgress(job, progress) {
      let percent = 0;
      let label = "-";

      if (job.status === "pending") {
        label = job.queue_position ? `Queue #${job.queue_position}` : "Queued";
      } else if (progress && typeof progress.percent === "number") {
        percent = Math.max(0, Math.min(100, progress.percent));
        label = `${Math.round(percent)}%${progress.kind ? ` ${progress.kind}` : ""}`;
      } else if (progress && progress.message) {
        percent = job.status === "running" ? 35 : 0;
        label = progress.message;
      } else if (job.status === "running") {
        percent = 35;
        label = "Running";
      } else if (job.status === "success") {
        percent = 100;
        label = "Complete";
      } else if (job.status === "failed") {
        percent = 100;
        label = "Failed";
      } else if (job.status === "cancelled") {
        percent = 100;
        label = "Cancelled";
      }

      const safeStatus = escapeHtml(job.status || "unknown");
      const safeLabel = escapeHtml(label);
      const safePercent = Number.isFinite(percent) ? percent : 0;
      return `
        <div class="job-progress ${safeStatus}" title="${safeLabel}">
          <div class="job-progress-bar" aria-label="${safeLabel}">
            <div class="job-progress-fill" style="width: ${safePercent}%"></div>
          </div>
          <div class="job-progress-label">${safeLabel}</div>
        </div>
      `;
    }

    function renderJobs(jobs, detailsMap, totalPages = 1) {
      if (!jobs.length) {
        jobsBody.innerHTML = '<tr><td colspan="6" class="jobs-empty">No downloads yet.</td></tr>';
        renderPagination(totalPages);
        return;
      }

      jobsBody.innerHTML = jobs.map((job) => {
        const detail = detailsMap.get(job.id) || {};
        const progress = detail.progress || null;

        let outputHtml = "-";
        let sizeText = "-";
        let revealPath = "";
        if (detail.error) {
          outputHtml = escapeHtml(detail.error);
        } else if (detail.details && Array.isArray(detail.details.files) && detail.details.files.length) {
          const files = detail.details.files;
          const totalSize = files.reduce((sum, file) => sum + (Number(file.size_bytes) || 0), 0);
          sizeText = fmtBytes(totalSize);
          outputHtml = files.map((file) => {
            const fileLabel = file.path ? file.path.split("/").pop() : "file";
            const kind = file.contains || file.kind || "saved";
            const href = `/files?path=${encodeURIComponent(file.path || "")}`;
            return `<a href="${href}" title="${escapeHtml(file.path || "")}">${escapeHtml(fileLabel)}</a> <span class="meta">${escapeHtml(kind)}</span>`;
          }).join("<br>");
          revealPath = files.find((file) => file.path)?.path || "";
        } else if (job.status === "success") {
          outputHtml = "Completed";
        }

        const deleteDisabled = job.status === "running" ? "disabled" : "";
        const deleteTitle = job.status === "running" ? "Delete after download stops" : "Delete";
        const actions = `
          ${renderStatus(job.status)}
          <button class="btn btn-warn icon-btn" data-action="delete" data-job="${escapeHtml(job.id)}" aria-label="Delete" title="${escapeHtml(deleteTitle)}" ${deleteDisabled}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M5 6l1 14h12l1-14"></path></svg>
          </button>
        `;

        return `
          <tr>
            <td>${renderShowDetail(job, detail)}</td>
            <td>${escapeHtml(fmtDate(job.created_at))}</td>
            <td>${renderJobProgress(job, progress)}</td>
            <td>${outputHtml}</td>
            <td>${escapeHtml(sizeText)}</td>
            <td><div class="actions">${actions}</div></td>
          </tr>
        `;
      }).join("");
      renderPagination(totalPages);
    }

    async function refreshJobs() {
      try {
        const [jobs, cfg] = await Promise.all([
          api("/jobs"),
          api("/config").catch(() => null),
        ]);
        if (cfg) {
          queuePaused = Boolean(cfg.queue_paused);
          if (cfg.default_out_path && !outPathInput.value.trim()) {
            outPathInput.value = cfg.default_out_path;
          }
          syncQueueToggleButton();
        }
        allJobs = jobs.sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
        updateDownloadsSummary(allJobs);
        const { pageJobs, totalPages } = currentJobsPage();

        const details = await Promise.all(
          pageJobs.map((job) => api(`/jobs/${encodeURIComponent(job.id)}`).catch(() => null))
        );

        const detailsMap = new Map();
        pageJobs.forEach((job, idx) => {
          detailsMap.set(job.id, details[idx]);
        });

        renderJobs(pageJobs, detailsMap, totalPages);
        lastUpdated.textContent = `Refreshing every ${Math.round(pollMs / 1000)}s • Last update ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        lastUpdated.textContent = `Refresh error: ${err.message}`;
      }
    }

    jobsBody.addEventListener("click", async (event) => {
      const target = event.target instanceof HTMLElement ? event.target.closest("[data-action]") : null;
      if (!(target instanceof HTMLElement)) return;
      const action = target.getAttribute("data-action");
      const jobId = target.getAttribute("data-job");
      if (!action) return;

      if (action === "queue-resume") {
        await setQueuePaused(false);
      } else if (action === "queue-pause") {
        await setQueuePaused(true);
      } else if (action === "show-folder") {
        const path = target.getAttribute("data-path");
        if (path) await showInFolder(path);
      } else if (!jobId) {
        return;
      } else if (action === "cancel") {
        await cancelJob(jobId);
      } else if (action === "delete") {
        await deleteJob(jobId);
      } else if (action === "restart") {
        await restartJob(jobId);
      }
    });

    credentialsForm.addEventListener("submit", saveCredentials);
    logoutBtn.addEventListener("click", logoutCredentials);
    form.addEventListener("submit", submitJob);
    refreshBtn.addEventListener("click", refreshJobs);
    outPathInput.addEventListener("click", chooseOutputPath);
    startQueueBtn.addEventListener("click", toggleQueuePause);
    cancelQueueBtn.addEventListener("click", cancelQueue);
    deleteQueueBtn.addEventListener("click", deleteQueue);
    [startQueueBtn, cancelQueueBtn, deleteQueueBtn, refreshBtn].forEach((button) => {
      button.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
      });
    });
    downloadsOutput.addEventListener("click", (event) => {
      event.stopPropagation();
    });
    jobsPageSize.addEventListener("change", () => {
      jobsPage = 1;
      refreshJobs();
    });
    jobsPrevPage.addEventListener("click", () => {
      jobsPage = Math.max(1, jobsPage - 1);
      refreshJobs();
    });
    jobsNextPage.addEventListener("click", () => {
      jobsPage += 1;
      refreshJobs();
    });
    artistSelect.addEventListener("change", loadReleasesForSelectedArtist);
    downloadMode.addEventListener("change", () => {
      userSelectedDownloadMode = downloadMode.value;
    });
    yearFilter.addEventListener("change", () => {
      renderReleases(yearFilter.value, mediaFilter.value);
    });
    mediaFilter.addEventListener("change", async () => {
      const selectedArtistId = artistSelect.value;
      if (selectedArtistId) {
        renderYears(currentReleases.filter((release) => matchesMediaFilter(release, mediaFilter.value)));
        renderReleases(yearFilter.value, mediaFilter.value);
        return;
      }

      await Promise.all([
        loadArtists(selectedArtistId),
        loadYearsForAvailability(yearFilter.value),
      ]);
      currentReleases = [];
      currentFilteredReleases = [];
      selectedReleaseUrls.clear();
      renderQueueSelection();
      syncModeOptions();
    });
    releaseCheckList.addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      if (target.getAttribute("data-action") === "toggle-release") {
        toggleReleaseDetails(target.getAttribute("data-release-id"));
      }
    });
    releaseCheckList.addEventListener("change", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement)) return;
      if (target.getAttribute("data-select-all") === "true") {
        if (target.checked) {
          currentFilteredReleases.forEach((release) => selectedReleaseUrls.add(release.url));
        } else {
          currentFilteredReleases.forEach((release) => selectedReleaseUrls.delete(release.url));
        }
        renderQueueSelection();
        syncModeOptions();
        return;
      }
      const url = target.getAttribute("data-release-url");
      if (!url) return;
      if (target.checked) selectedReleaseUrls.add(url);
      else selectedReleaseUrls.delete(url);
      renderQueueSelection();
      syncModeOptions();
    });
    selectionPageSize.addEventListener("change", () => {
      selectionPage = 1;
      renderQueueSelection();
    });
    selectionPrevPage.addEventListener("click", () => {
      selectionPage = Math.max(1, selectionPage - 1);
      renderQueueSelection();
    });
    selectionNextPage.addEventListener("click", () => {
      selectionPage += 1;
      renderQueueSelection();
    });
    document.addEventListener("click", () => closeCustomSelects());
    document.addEventListener("keydown", (event) => {
      const openShell = document.querySelector(".custom-select.open");
      if (event.key === "Escape") {
        closeCustomSelects();
      } else if (openShell && event.key.length === 1) {
        const select = openShell.querySelector("select");
        if (select && typeaheadCustomSelect(select, openShell, event.key)) event.preventDefault();
      }
    });

    enhanceSelects();
    syncQueueToggleButton();
    loadCredentialsStatus();
    loadArtists();
    loadYearsForAvailability();
    refreshJobs();
    setInterval(refreshJobs, pollMs);
  </script>
</body>
</html>
